repos:
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        args: ["--line-length=99"]
  - repo: https://github.com/pre-commit/mirrors-autopep8
    rev: v2.3.2
    hooks:
      - id: autopep8
        args: ["--max-line-length=99", "--in-place", "--aggressive", "--aggressive"]
  - repo: https://github.com/pycqa/flake8
    rev: 7.2.0
    hooks:
      - id: flake8
        args: ["--max-line-length=99"]
